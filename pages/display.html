<!DOCTYPE html>
<html>

<head>
    <title>Lead Success API for Salesforce Samples - Display Data </title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline' https://delightful-desert-016e2a610.4.azurestaticapps.net/ https://lsapisamplesbackend-bhesadgtbja4dmgq.germanywestcentral-01.azurewebsites.net/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: https://*.convey.de http://*.convey.de; object-src 'self' blob: data:; frame-src 'self' blob: data:; connect-src 'self' blob: http://*.convey.de https://*.convey.de ws://127.0.0.1:5504 http://localhost:3000 https://delightful-desert-016e2a610.4.azurestaticapps.net/ https://lsapisamplesbackend-bhesadgtbja4dmgq.germanywestcentral-01.azurewebsites.net/;" />
    <meta name="viewport"
        content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width" />
    <link href="../css/display.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../images/api-sf.ico">
</head>

<body>

    <!-- Header Area -->
    <header class="main-header">
        <div class="logo">
            <img src="../images/leadsuccess_white.svg" />
        </div>
        <div class="header-center">
            <span class="header-title">Salesforce API Manager</span>
            <span class="header-divider">•</span>
            <span class="report-name">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                API Endpoints
            </span>
        </div>
        <div class="header-right">
            <button id="postmanButton" class="postman-button">
                <img src="/images/postman-icon.svg" alt="Postman" width="14" height="14">
                Postman
            </button>
            <a href="/docs/LeadSuccess_API_for SalesForce.pdf" download class="doc-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                API Docs
            </a>
            <button id="logoutButton" class="logout-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>
    </header>


    <!-- Main Area -->
    <main class="table">

        <section class="table__header">
            <div class="view-selector">
                <label for="apiSelector" class="selector-label">API Endpoints:</label>
                <select id="apiSelector">
                </select>
            </div>

            <!--  Search felder -->
            <div class="input-group" style="display: none;">
                <input type="search" id="search" placeholder="Search Data.." />
                <img src="/images/search.png" alt="">
            </div>

            <!-- Actions -->
            <div class="actions">
                <!-- Toggle Filter Button -->
                <button id="toggleFiltersButton" class="toggle-filters-button" style="display: none;" title="Toggle Filters">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button id="viewLeadsButton" class="action-button" disabled style="display: none;">View Leads</button>
                <button id="viewLeadReportsButton" class="action-button" disabled>View Lead Reports</button>
            </div>
        </section>

        <div id="filterInputs" class="filter-inputs" style="display: none;"></div>


        <section class="table__body">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
            <p id="noDataMessage"></p>
        </section>

    </main>

    <div class="pagination" style="display: none;">
        <button id="nextButton" class="pagination-button" disabled>Next</button>
    </div>

    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <div id="errorMessage" class="error-message"></div>


    <script src="/js/controllers/headerController.js" type="module" defer></script>
    <script src="/js/controllers/displayController.js" type="module" defer></script>
    <script src="/js/controllers/postman-integration.js" type="module" defer></script>
</body>

</html>
