<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to Salesforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        salesforce: {
                            blue: '#0176D3',
                            dark: '#032D60',
                            light: '#EAF5FE',
                            gradient: {
                                start: '#00A1E0',
                                end: '#0176D3'
                            }
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            box-sizing: border-box;


        }

        .animate-float-delay {
            animation-delay: 0.5s;
        }

        .gradient-border {
            position: relative;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0.75rem;
            padding: 2px;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Responsive adjustments for different devices */
        .main-card {
            width: 440px;
            max-width: 90%;
            margin: 1rem auto;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tablet adjustments */
        @media (max-width: 768px) {
            .main-card {
                width: 100%;
                max-width: 420px;
                margin: 1rem;
            }

            html, body {
                padding: 0.5rem;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .main-card {
                width: 100%;
                max-width: 100%;
                margin: 0.5rem;
            }

            html, body {
                padding: 0.25rem;
            }
        }

        /* Small mobile devices */
        @media (max-width: 360px) {
            .main-card {
                margin: 0.25rem;
            }
        }
    </style>
</head>
<body class="bg-white font-inter">
    <!-- Main Card -->
    <div class="relative z-10 main-card gradient-border rounded-xl shadow-lg border border-gray-200">
            <div class="relative bg-white rounded-xl p-6 md:p-8">
                <!-- Logo Header -->
                <div class="text-center mb-6 md:mb-8">
                    <div class="relative inline-block mb-3 md:mb-4">
                        <!-- Animated Cloud Container -->
                        <div class="relative w-20 h-20 md:w-24 md:h-24 mx-auto animate-float">
                            <!-- Cloud Background -->
                            <svg class="absolute inset-0 w-full h-full" viewBox="0 0 200 200">
                                <defs>
                                    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#00A1E0" />
                                        <stop offset="100%" stop-color="#0176D3" />
                                    </linearGradient>
                                    <filter id="shadow">
                                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2" />
                                    </filter>
                                </defs>
                                <path fill="url(#modernGradient)" d="M150 80c-5-15-18-25-34-25-8 0-16 3-22 8-8-10-20-16-34-16-24 0-44 20-44 44 0 2 0 4 1 6-10 5-17 16-17 28 0 18 14 32 32 32h110c18 0 32-14 32-32 0-16-11-29-26-31 1-3 2-6 2-9 0-2 0-3 0-5z" filter="url(#shadow)"/>
                            </svg>
                            
                            <!-- Lightning Bolt -->
                            <svg class="absolute inset-0 w-full h-full animate-pulse-slow" viewBox="0 0 200 200">
                                <path fill="#FFB50B" d="M115 90l-15 25h10l-10 20 20-30h-10l15-15z" opacity="0.9"/>
                            </svg>
                            
                            <!-- Glow Effect -->
                            <div class="absolute -inset-2 bg-salesforce-blue/10 blur-xl rounded-full"></div>
                        </div>
                        
                        <!-- Verified Badge -->
                        <div class="absolute -top-1 -right-1">
                            <div class="flex items-center justify-center w-7 h-7 md:w-8 md:h-8 bg-green-500 rounded-full border-2 border-white">
                                <svg class="w-3.5 h-3.5 md:w-4 md:h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-salesforce-dark to-salesforce-blue bg-clip-text text-transparent mb-2">
                        Connect to Salesforce
                    </h1>
                    <p class="text-slate-600 text-sm font-medium">
                        Choose your environment to continue
                    </p>
                </div>

                <!-- Environment Selector -->
                <form id="authForm" class="space-y-5 md:space-y-6">
                    <div class="space-y-3">
                        <label class="block text-sm font-semibold text-salesforce-dark">
                            Environment:
                        </label>
                        
                        <!-- Radio Style Selector -->
                        <div class="grid grid-cols-1 gap-3">
                            <label class="relative">
                                <input type="radio" name="environment" value="production" checked 
                                       class="peer hidden" />
                                <div class="p-3 md:p-4 border-2 border-slate-200 rounded-lg cursor-pointer transition-all duration-200
                                           peer-checked:border-salesforce-blue peer-checked:bg-salesforce-light/30
                                           hover:border-salesforce-blue/50 hover:bg-slate-50">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <div class="flex-shrink-0">
                                                <div class="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-gradient-to-br from-salesforce-blue to-salesforce-dark 
                                                            flex items-center justify-center">
                                                    <svg class="w-3.5 h-3.5 md:w-4 md:h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                                    </svg>
                                                </div>
                                            </div>
                                            <div class="text-left">
                                                <span class="font-semibold text-salesforce-dark text-sm md:text-base block">Production</span>
                                                <span class="text-xs md:text-sm text-slate-500">login.salesforce.com</span>
                                            </div>
                                        </div>
                                        <div class="peer-checked:block hidden">
                                            <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-salesforce-blue rounded-full animate-pulse"></div>
                                        </div>
                                    </div>
                                </div>
                            </label>

                            <label class="relative opacity-50 cursor-not-allowed">
                                <input type="radio" name="environment" value="sandbox"
                                       class="peer hidden" disabled />
                                <div class="p-3 md:p-4 border-2 border-slate-200 rounded-lg bg-gray-50 transition-all duration-200">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <div class="flex-shrink-0">
                                                <div class="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-gray-300
                                                            flex items-center justify-center">
                                                    <svg class="w-3.5 h-3.5 md:w-4 md:h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                                    </svg>
                                                </div>
                                            </div>
                                            <div class="text-left">
                                                <span class="font-semibold text-gray-400 text-sm md:text-base block">Sandbox</span>
                                                <span class="text-xs md:text-sm text-gray-400">Coming soon</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Connect Button -->
                    <button type="submit" 
                            class="w-full py-3 md:py-3.5 px-4 bg-gradient-to-r from-salesforce-blue to-salesforce-dark 
                                   text-white font-semibold rounded-lg shadow-lg hover:shadow-xl 
                                   transition-all duration-300 transform hover:-translate-y-0.5
                                   flex items-center justify-center space-x-2 group text-sm md:text-base">
                        <span>Continue to Salesforce</span>
                        <svg class="w-4 h-4 md:w-5 md:h-5 group-hover:translate-x-1 transition-transform duration-300" 
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </button>

                    <!-- Security Info -->
                    <div class="space-y-3 md:space-y-4 pt-3 md:pt-4 border-t border-slate-100">
                        <div class="flex items-start space-x-2 md:space-x-3">
                            <div class="flex-shrink-0 mt-0.5">
                                <div class="w-4 h-4 md:w-5 md:h-5 rounded-full bg-green-100 flex items-center justify-center">
                                    <svg class="w-2.5 h-2.5 md:w-3 md:h-3 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                            </div>
                            <div>
                                <p class="text-xs md:text-sm text-slate-600 leading-tight">
                                    <span class="font-semibold text-salesforce-dark">Secure OAuth 2.0 Connection</span><br>
                                    You will be redirected to Salesforce to securely authorize access.
                                    Your credentials are never stored by our application.
                                </p>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-1.5 md:space-x-2 text-xs text-slate-500">
                            <svg class="w-2.5 h-2.5 md:w-3 md:h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <span class="text-xs md:text-sm">End-to-end encrypted connection</span>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer - WITHOUT BORDER, seamless integration -->
            <div class="px-4 md:px-6 py-2.5 md:py-3 bg-gradient-to-r from-salesforce-light/10 to-blue-50/10 rounded-b-xl">
                <div class="flex items-center justify-center space-x-1.5 text-xs text-slate-500">
                    <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="text-xs md:text-sm truncate">Requires Salesforce API access permissions</span>
                </div>
            </div>
        </div>

    <script>
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const environment = document.querySelector('input[name="environment"]:checked').value;
            const loginUrl = environment === 'sandbox'
                ? 'https://test.salesforce.com'
                : 'https://login.salesforce.com';

            // Get orgId from URL params
            const urlParams = new URLSearchParams(window.location.search);
            const orgId = urlParams.get('orgId') || 'default';

            // Show loading state
            const button = this.querySelector('button[type="submit"]');
            const originalText = button.innerHTML;
            button.innerHTML = `
                <svg class="animate-spin h-4 w-4 md:h-5 md:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-2">Connecting...</span>
            `;
            button.disabled = true;

            // Redirect to backend OAuth endpoint
            setTimeout(() => {
                window.location.href = `/auth/salesforce/redirect?orgId=${encodeURIComponent(orgId)}&loginUrl=${encodeURIComponent(loginUrl)}`;
            }, 800);
        });

        // Add animation to radio selection (only for enabled radios)
        document.querySelectorAll('input[name="environment"]:not([disabled])').forEach(radio => {
            radio.addEventListener('change', function() {
                // Add subtle animation effect
                const label = this.closest('label');
                label.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    label.style.transform = 'scale(1)';
                }, 150);
            });
        });
    </script>
</body>
</html>
